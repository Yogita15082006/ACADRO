spring.application.name=AcroNexus

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/acronexus
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:your_db_password_here}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.config.import=optional:classpath:application-local.properties

# JPA / Hibernate Configuration
# We use validate because the schema is already created by SQL scripts and we don't want Hibernate to modify it.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# API Server Configuration
server.port=8080
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# JWT Configuration
# Note: In production, store this securely (e.g. environment variable). 
# This must be at least 256-bit (32 bytes) Base64 encoded for HS256.
acronexus.app.jwtSecret=${JWT_SECRET:0123456789012345678901234567890123456789012345678901234567890123}
# Expiration: 24 hours (86400000 ms)
acronexus.app.jwtExpirationMs=86400000

# AI Service Configuration (External FastAPI module)
ai.service.base-url=${AI_SERVICE_URL:http://127.0.0.1:8000}
ai.service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:300000}
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Multipart Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.data.web.pageable.max-page-size=2000  